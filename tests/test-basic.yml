name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_BASE_REF: main
      GITHUB_HEAD_REF: feature-branch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git user
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Create base commit with yarn.lock
        run: |
          git checkout -b main 2>/dev/null || git checkout main
          cat > yarn.lock << 'EOF'
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          # yarn lockfile v1

          lodash@^4.17.21:
            version "4.17.21"
            resolved "https://registry.yarnpkg.com/lodash/-/lodash-4.17.21.tgz#679591c564c3bffaae8454cf0b3df370c3d6911c"
            integrity sha512-v2kDEe57lecTulaDIuNTPy3Ry4gLGJ6Z1O3vE1krgXZNrsQ+LFTGHVxVjcXPs17LhbZR/iIBsOoyIBdxFk1A==
          EOF
          git add yarn.lock
          git commit -m "Add yarn.lock with lodash"

      - name: Create feature branch with updated yarn.lock
        run: |
          git checkout -b feature-branch
          cat > yarn.lock << 'EOF'
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          # yarn lockfile v1

          lodash@^4.17.21:
            version "4.17.21"
            resolved "https://registry.yarnpkg.com/lodash/-/lodash-4.17.21.tgz#679591c564c3bffaae8454cf0b3df370c3d6911c"
            integrity sha512-v2kDEe57lecTulaDIuNTPy3Ry4gLGJ6Z1O3vE1krgXZNrsQ+LFTGHVxVjcXPs17LhbZR/iIBsOoyIBdxFk1A==

          react@^18.0.0:
            version "18.2.0"
            resolved "https://registry.yarnpkg.com/react/-/react-18.2.0.tgz#555bd98592883255fa00de14f1151a917b5d77d5"
            integrity sha512-/3IjMdb2L9QbBdWiW5e3P2/npwMBaU9mHCSCUzNln0ZCYbcfTsGbTJrU/kGemdH2IWmB2ioZ+zkxtmq6g09fA==
          EOF
          git add yarn.lock
          git commit -m "Add react to yarn.lock"

      - name: Run yarn-lock-changes action
        id: action
        uses: .
        with:
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "Action completed (may have failed to post comment without real PR context)"
          echo "This is expected in act environment without a real GitHub PR"
          echo "PASS: action executed without crashing unexpectedly"
