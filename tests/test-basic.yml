name: Test basic usage - yarn lock changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample yarn.lock file
        run: |
          cat > yarn.lock << 'EOF'
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          # yarn lockfile v1

          lodash@^4.17.21:
            version "4.17.21"
            resolved "https://registry.yarnpkg.com/lodash/-/lodash-4.17.21.tgz#679591c564c3bffaae8454cf0b3df370c3d6911c"
            integrity sha512-v2kDEe57lecTulaDIuNTPy3Ry4gLGJ6Z1O3vE1krgXZNrsQ+LFTGHVxVjcXPs17LhbZa2bzmHABBa3YggoCQ==
          EOF

      - name: Run yarn lock changes action
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          path: yarn.lock
        continue-on-error: true

      - name: Assert action ran (may fail due to no real PR context)
        run: |
          echo "Action completed (with or without error due to no real PR)"
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to either succeed or fail gracefully
          # In a non-PR context without a real token, it may fail to post comment
          # but should not crash with an unhandled exception
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran as expected"
