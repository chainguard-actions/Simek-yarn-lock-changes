name: Test custom yarn.lock path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a yarn.lock file at a custom path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/packages/app"
          cat > "$GITHUB_WORKSPACE/packages/app/yarn.lock" << 'EOF'
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          # yarn lockfile v1

          react@^18.0.0:
            version "18.2.0"
            resolved "https://registry.yarnpkg.com/react/-/react-18.2.0.tgz#555bd98592883255fa1b4d5f9a9b5e3e3e3e3e3e"
            integrity sha512-/3IjMdb2L9QbBdWiW5e3P2/npwMBaU9mHCSCUzNln0ZCYbcfTsGbTJrU/kGemdH2IWmB2ioZ+zkxtmq6g09fA==
          EOF

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          path: packages/app/yarn.lock
        continue-on-error: true

      - name: Assert action ran with custom path (completed or failed gracefully without PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail because there's no real PR, but it should not crash with an unhandled error
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
