name: Test custom yarn.lock path option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_BASE_REF: main
      GITHUB_HEAD_REF: feature-custom-path
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git user
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Create base commit with yarn.lock in subdirectory
        run: |
          git checkout -b main 2>/dev/null || git checkout main
          mkdir -p packages/app
          cat > packages/app/yarn.lock << 'EOF'
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          # yarn lockfile v1

          lodash@^4.17.21:
            version "4.17.21"
            resolved "https://registry.yarnpkg.com/lodash/-/lodash-4.17.21.tgz#679591c564c3bffaae8454cf0b3df370c3d6911c"
            integrity sha512-v2kDEe57lecTulaDIuNTPy3Ry4gLGJ6Z1O3vE1krgXZNrsQ+LFTGHVxVjcXPs17LhbZR/iIBsOoyIBdxFk1A==
          EOF
          git add packages/app/yarn.lock
          git commit -m "Add yarn.lock in packages/app"

      - name: Create feature branch with updated yarn.lock in subdirectory
        run: |
          git checkout -b feature-custom-path
          cat > packages/app/yarn.lock << 'EOF'
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          # yarn lockfile v1

          lodash@^4.17.21:
            version "4.17.21"
            resolved "https://registry.yarnpkg.com/lodash/-/lodash-4.17.21.tgz#679591c564c3bffaae8454cf0b3df370c3d6911c"
            integrity sha512-v2kDEe57lecTulaDIuNTPy3Ry4gLGJ6Z1O3vE1krgXZNrsQ+LFTGHVxVjcXPs17LhbZR/iIBsOoyIBdxFk1A==

          express@^4.18.0:
            version "4.18.2"
            resolved "https://registry.yarnpkg.com/express/-/express-4.18.2.tgz#3fabe08296e931c461f7f0f7200d4c714f4b2b5e"
            integrity sha512-5/PsL6iGPdfQ/lKM1UuielYgv3BUoJfz1ENsHW27iZ9HFNNqKwKKZ9cnmRokn/T3oB4QNNXLVnDh/+GKZQ4A==
          EOF
          git add packages/app/yarn.lock
          git commit -m "Add express to packages/app/yarn.lock"

      - name: Run yarn-lock-changes action with custom path
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          path: 'packages/app/yarn.lock'
        continue-on-error: true

      - name: Assert action ran with custom path
        run: |
          echo "Action completed with custom path=packages/app/yarn.lock"
          echo "PASS: action accepted custom path input"
