name: Test custom yarn.lock path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a custom yarn.lock file at a nested path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/packages/app"
          touch "$GITHUB_WORKSPACE/packages/app/yarn.lock"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          path: packages/app/yarn.lock

      - name: Assert action failed due to missing PR context (not due to missing file)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in a PR context, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when not in a PR context (custom path input accepted)"
