name: Test failOnDowngrade and groupByType inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal yarn.lock file
        run: |
          cat > yarn.lock << 'EOF'
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          # yarn lockfile v1

          express@^4.18.0:
            version "4.18.2"
            resolved "https://registry.yarnpkg.com/express/-/express-4.18.2.tgz#3fabe08296e931c461f7c4f7c9b6d8b3c4f3d8e1"
            integrity sha512-pMiaYuBjBBkMkA5GBpBjBBkMkA5GBpBjBBkMkA5GBpBjBBkMkA5GBpBjBBkMkA5GBpBjBBkMkA5GBpBjBBkMkA==
          EOF

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          path: yarn.lock
          failOnDowngrade: 'true'
          groupByType: 'true'
          collapsibleThreshold: '10'
          updateComment: 'false'
        continue-on-error: true

      - name: Assert action failed with expected PR context error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in a PR context, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when not in a PR context (failOnDowngrade/groupByType inputs accepted)"
