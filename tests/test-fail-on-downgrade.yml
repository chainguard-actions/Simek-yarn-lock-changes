name: Test failOnDowngrade option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample yarn.lock file
        run: |
          cat > yarn.lock << 'EOF'
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          # yarn lockfile v1

          express@^4.18.0:
            version "4.18.2"
            resolved "https://registry.yarnpkg.com/express/-/express-4.18.2.tgz#3fabe08296e931c461f7c4f7c9b6d0f9d8e8e8e8"
            integrity sha512-o4w5oCGk9Zj1QDWG2QLZK5QDWG2QLZK5QDWG2QLZK5QDWG2QLZK5QDWG2QLZK5QDWG2QLZK5QDWG2QLZK5Q==
          EOF

      - name: Run yarn lock changes action with failOnDowngrade enabled
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          path: yarn.lock
          failOnDowngrade: 'true'
        continue-on-error: true

      - name: Assert action ran with failOnDowngrade option
        run: |
          echo "Action completed with failOnDowngrade=true"
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with failOnDowngrade option as expected"
