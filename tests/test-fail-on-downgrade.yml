name: Test failOnDowngrade option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_BASE_REF: main
      GITHUB_HEAD_REF: feature-downgrade
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git user
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Create base commit with yarn.lock (higher version)
        run: |
          git checkout -b main 2>/dev/null || git checkout main
          cat > yarn.lock << 'EOF'
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          # yarn lockfile v1

          lodash@^4.17.21:
            version "4.17.21"
            resolved "https://registry.yarnpkg.com/lodash/-/lodash-4.17.21.tgz#679591c564c3bffaae8454cf0b3df370c3d6911c"
            integrity sha512-v2kDEe57lecTulaDIuNTPy3Ry4gLGJ6Z1O3vE1krgXZNrsQ+LFTGHVxVjcXPs17LhbZR/iIBsOoyIBdxFk1A==
          EOF
          git add yarn.lock
          git commit -m "Add yarn.lock with lodash 4.17.21"

      - name: Create feature branch with downgraded yarn.lock
        run: |
          git checkout -b feature-downgrade
          cat > yarn.lock << 'EOF'
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          # yarn lockfile v1

          lodash@^4.17.21:
            version "4.17.15"
            resolved "https://registry.yarnpkg.com/lodash/-/lodash-4.17.15.tgz#b447f6670a44455f610369c06d3596b5f3b5a7e6"
            integrity sha512-8xOcRHvCjnocdS5cpwXQXVzmmh5e5+saE2QGoeQmbKmRS6J41Twnxtx6Zt5ydKk1ODXoIMPsASVsLMAtHQLng==
          EOF
          git add yarn.lock
          git commit -m "Downgrade lodash to 4.17.15"

      - name: Run yarn-lock-changes action with failOnDowngrade
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          failOnDowngrade: 'true'
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "Action completed with failOnDowngrade=true"
          echo "In a real PR context, this would fail due to downgrade detection"
          echo "PASS: action executed and handled failOnDowngrade option"
