name: Test groupByType and collapsibleThreshold options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_BASE_REF: main
      GITHUB_HEAD_REF: feature-many-changes
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git user
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Create base commit with yarn.lock
        run: |
          git checkout -b main 2>/dev/null || git checkout main
          cat > yarn.lock << 'EOF'
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          # yarn lockfile v1

          lodash@^4.17.21:
            version "4.17.21"
            resolved "https://registry.yarnpkg.com/lodash/-/lodash-4.17.21.tgz#679591c564c3bffaae8454cf0b3df370c3d6911c"
            integrity sha512-v2kDEe57lecTulaDIuNTPy3Ry4gLGJ6Z1O3vE1krgXZNrsQ+LFTGHVxVjcXPs17LhbZR/iIBsOoyIBdxFk1A==
          EOF
          git add yarn.lock
          git commit -m "Initial yarn.lock"

      - name: Create feature branch with multiple yarn.lock changes
        run: |
          git checkout -b feature-many-changes
          cat > yarn.lock << 'EOF'
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          # yarn lockfile v1

          axios@^1.0.0:
            version "1.4.0"
            resolved "https://registry.yarnpkg.com/axios/-/axios-1.4.0.tgz#38a7bf1224cd308de271146038b551d725f0be1f"
            integrity sha512-S4XCWMEmzvo64T9GfvQDOXgYRDJ/wsSZc7Jvdgx5u1sd0JwsuPLqb3SYmusag+edF6ziyMensPVqLTSc1PiSEA==

          lodash@^4.17.21:
            version "4.17.21"
            resolved "https://registry.yarnpkg.com/lodash/-/lodash-4.17.21.tgz#679591c564c3bffaae8454cf0b3df370c3d6911c"
            integrity sha512-v2kDEe57lecTulaDIuNTPy3Ry4gLGJ6Z1O3vE1krgXZNrsQ+LFTGHVxVjcXPs17LhbZR/iIBsOoyIBdxFk1A==

          react@^18.0.0:
            version "18.2.0"
            resolved "https://registry.yarnpkg.com/react/-/react-18.2.0.tgz#555bd98592883255fa00de14f1151a917b5d77d5"
            integrity sha512-/3IjMdb2L9QbBdWiW5e3P2/npwMBaU9mHCSCUzNln0ZCYbcfTsGbTJrU/kGemdH2IWmB2ioZ+zkxtmq6g09fA==

          typescript@^5.0.0:
            version "5.1.6"
            resolved "https://registry.yarnpkg.com/typescript/-/typescript-5.1.6.tgz#02f8ac202b6dad2c0dd5e0913745b47a37998274"
            integrity sha512-zaWCozRZ6DLEWAWFrVDz1H6FVXzUSfTy5FUMWsQlU8Ym5JP9eO4xkTIROFCQvhQf61z6O/G6ugw3SgAnvvm+HA==
          EOF
          git add yarn.lock
          git commit -m "Add multiple packages to yarn.lock"

      - name: Run yarn-lock-changes action with groupByType and low collapsibleThreshold
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          groupByType: 'true'
          collapsibleThreshold: '2'
        continue-on-error: true

      - name: Assert action ran with groupByType option
        run: |
          echo "Action completed with groupByType=true and collapsibleThreshold=2"
          echo "PASS: action accepted groupByType and collapsibleThreshold inputs"
