name: Test - Invalid Token with PR Context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: invalid-fake-token-12345
          path: yarn.lock
          updateComment: 'false'
          failOnDowngrade: 'false'
          groupByType: 'false'
          collapsibleThreshold: '25'

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token and no real PR context, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token / no PR context"
