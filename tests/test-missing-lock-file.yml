name: Test - Missing yarn.lock File
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent yarn.lock path (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          path: nonexistent/path/yarn.lock

      - name: Assert action failed due to missing lock file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when yarn.lock does not exist, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when yarn.lock file is missing"
