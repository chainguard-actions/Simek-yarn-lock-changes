name: Test no PR context error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a yarn.lock file so the action can reach the PR context check
        run: |
          touch "$GITHUB_WORKSPACE/yarn.lock"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          path: yarn.lock

      - name: Assert action failed with expected PR context error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not in a PR context, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when not in a PR context"
